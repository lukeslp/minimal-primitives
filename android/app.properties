# Android identity for Minimal Primitives. This is the only place the
# application id and version are set; Gradle and tools/android.py read it.
# The application id is permanent (approved October 16, 2026): never change it.
# Raise VERSION_CODE for every build that leaves this machine.

APPLICATION_ID=com.oneimpossiblethingatatime.minimalprimitives
VERSION_NAME=0.3.2
VERSION_CODE=7

# The camera-free fdroid flavor (tools/build.py --variant fdroid) has its own
# version. Its codes and the full flavor's must never collide: every new code is
# higher than every code already issued to either flavor.
FDROID_VERSION_NAME=0.4.0
FDROID_VERSION_CODE=8
