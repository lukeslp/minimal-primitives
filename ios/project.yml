name: MinimalPrimitives
options:
  bundleIdPrefix: com.oneimpossiblethingatatime
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 596T7J7FB6
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "5"
targets:
  MinimalPrimitives:
    type: application
    platform: iOS
    sources:
      - path: MinimalPrimitives
      # The collection exactly as tools/build.py makes it, copied in by tools/ios.py.
      - path: www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oneimpossiblethingatatime.minimalprimitives
        PRODUCT_NAME: Minimal Primitives
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Minimal Primitives
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MinimalPrimitives/Info.plist
      properties:
        CFBundleDisplayName: Minimal Primitives
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchSphere
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: "Look and hold by head or eyes uses the camera to follow where you look. Pictures stay on this device and are never saved."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.puzzle-games
