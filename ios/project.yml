name: MinimalPrimitives
options:
  bundleIdPrefix: com.oneimpossiblethingatatime
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 596T7J7FB6
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.5.9"
    CURRENT_PROJECT_VERSION: "29"
targets:
  MinimalPrimitives:
    type: application
    platform: iOS
    sources:
      - path: MinimalPrimitives
      # The privacy manifest: no tracking, no collected data, and no required-reason API (the release target uses
      # none; UserDefaults appears only in DEBUG checks). Named here so it is always copied into the app.
      - path: MinimalPrimitives/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The collection exactly as tools/build.py makes it, copied in by tools/ios.py.
      - path: www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oneimpossiblethingatatime.minimalprimitives
        PRODUCT_NAME: Minimal Primitives
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Minimal Primitives
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MinimalPrimitives/Info.plist
      properties:
        CFBundleDisplayName: Minimal Primitives
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        # The launch screen is the opening's first frame: its ground alone, white or black with the phone's
        # appearance (LaunchBackground). The opening itself plays in the web layer (web/library-theme.js, collection.js).
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: "Use the front camera to move the game pointer with your head or eyes. Camera images are processed on this device and are never saved or sent."
        # Tilt · 3D's Phone tilt (its Settings) reads the phone's lean through the web view, which asks first.
        NSMotionUsageDescription: "Lean the phone to steer Tilt · 3D once you turn on Phone tilt in its Settings. Motion readings steer the game and are never saved or sent."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.puzzle-games
