name: Android F-Droid candidate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build inputs
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Camera-free collection (as F-Droid builds it, without MediaPipe)
        run: |
          rm -rf imports/glance/vendor
          python3 tools/build.py --variant fdroid --no-zip
      - name: Build and test the unsigned fdroid release
        run: ./android/gradlew -p android --no-daemon --console=plain :app:testFdroidReleaseUnitTest :app:assembleFdroidRelease
      - name: Verify the APK against the source tree
        run: |
          APK=android/app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
          python3 fdroid/verify-apk.py "$APK" --build-tools "$ANDROID_HOME/build-tools/36.0.0" | tee android/fdroid-verification.json
          sha256sum "$APK"
      - name: Retain candidate and check results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minimal-primitives-fdroid-candidate
          path: |
            android/app/build/outputs/apk/fdroid/release/*.apk
            android/app/build/test-results/testFdroidReleaseUnitTest/
            android/fdroid-verification.json
          if-no-files-found: warn
